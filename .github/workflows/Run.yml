on: [push]
jobs:
  one:
    runs-on: ubuntu-latest
    steps:
      - run: echo "A" > actions/upload-artifact@v4/note.txt
      - run: cat note.txt
      - uses: actions/upload-artifact@v4
        with: 
          name: note
          path: note.txt
        
  two:
    needs: one
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: note
        run: cat note.txt
